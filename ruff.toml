target-version = "py311"
line-length = 120
extend-exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "build",
  "dist",
  "pyproject.toml",
  "**/*.toml",
  "tests",
  "DailyAnalyisis/dashboard",
  "DailyAnalyisis/pages",
  "DailyAnalyisis/scripts",
  "DailyAnalyisis/src",
  "DailyAnalyisis/legacy_main.py",
]

[lint]
select = ["E", "F", "I", "W"]

[lint.isort]
combine-as-imports = true
length-sort = true
known-first-party = ["gsuid_core", "DailyAnalyisis"]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
